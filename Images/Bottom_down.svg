<svg width="100%" height="80" viewBox="0 0 850 100" xmlns="http://www.w3.org/2000/svg">
    <style>
        .bg { fill: #000000; }
        .matrix-text {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            fill: #00FF41;
            opacity: 0.8;
        }
        
        @keyframes fall {
            from { transform: translateY(-100px); opacity: 1; }
            to { transform: translateY(100px); opacity: 0; }
        }

        /* Generate columns dynamically with CSS */
        .col { animation: fall 3s linear infinite; }
        .col:nth-child(2n) { animation-duration: 4s; animation-delay: -1s; fill: #008F11; }
        .col:nth-child(3n) { animation-duration: 2.5s; animation-delay: -2s; fill: #50aa00; }
        .col:nth-child(5n) { animation-duration: 5s; animation-delay: 0s; }
        .col:nth-child(7n) { animation-duration: 3.5s; animation-delay: -1.5s; }
    </style>
    
    <rect class="bg" width="100%" height="100%"/>
    
    <!-- Matrix columns -->
    <g class="matrix-text">
        <text class="col" x="10" y="0">1 0 1 A 4 %</text>
        <text class="col" x="30" y="0">0 F X # 9 @</text>
        <text class="col" x="50" y="0">1 1 0 0 1</text>
        <text class="col" x="70" y="0">P R A V I N</text>
        <text class="col" x="90" y="0">X Y Z 8 2</text>
        <text class="col" x="110" y="0">0 0 1 1 0</text>
        <text class="col" x="130" y="0">H A C K E R</text>
        <text class="col" x="150" y="0"># $ % &amp; *</text>
        <text class="col" x="170" y="0">1 0 1 1 1</text>
        <text class="col" x="190" y="0">C O D E </text>

        <text class="col" x="210" y="0">0 1 0 1 0</text>
        <text class="col" x="230" y="0">P Y T H O N</text>
        <text class="col" x="250" y="0">A I / M L</text>
        <text class="col" x="270" y="0">B I N A R Y</text>
        <text class="col" x="290" y="0">0 0 1 0 1</text>
        <text class="col" x="310" y="0">W E B</text>
        <text class="col" x="330" y="0">S E C U R E</text>
        <text class="col" x="350" y="0">1 1 1 0 0</text>
        <text class="col" x="370" y="0">D A T A</text>
        <text class="col" x="390" y="0">4 0 4</text>
        
        <text class="col" x="430" y="0">1 0 1 1 0</text>
        <text class="col" x="450" y="0">L I N U X</text>
        <text class="col" x="470" y="0">R O O T</text>
        <text class="col" x="490" y="0">S U D O</text>
        <text class="col" x="510" y="0">0 1 0 0 1</text>
        <text class="col" x="530" y="0">B A S H</text>
        <text class="col" x="550" y="0">S H E L L</text>
        <text class="col" x="570" y="0">1 1 0 1 1</text>
        <text class="col" x="590" y="0">K A L I</text>
        <text class="col" x="610" y="0">G I T</text>

        <text class="col" x="650" y="0">0 1 1 0 1</text>
        <text class="col" x="670" y="0">N E T</text>
        <text class="col" x="690" y="0">H T T P</text>
        <text class="col" x="710" y="0">W I F I</text>
        <text class="col" x="730" y="0">1 0 1 0 0</text>
        <text class="col" x="750" y="0">S Q L I</text>
        <text class="col" x="770" y="0">X S S</text>
        <text class="col" x="790" y="0">0 0 0 1 1</text>
        <text class="col" x="810" y="0">P I N G</text>
        <text class="col" x="830" y="0">N M A P</text>
    </g>

    <!-- Overlay Gradient to fade out bottom -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="black" stop-opacity="0"/>
        <stop offset="80%" stop-color="black" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="black" stop-opacity="1"/>
    </linearGradient>
    <rect width="100%" height="100%" fill="url(#fade)"/>
    
    <text x="850" y="90%" fill="#00FF41" font-family="'Courier New', monospace" font-size="20" font-weight="bold">
        Code is poetry written in a language computers can understand. Let's create something amazing together! ✨
        <animate attributeName="x" from="850" to="-1300" dur="12s" repeatCount="indefinite" />
    </text>
</svg>
